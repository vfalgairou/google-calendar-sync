name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: docker compose -f compose.test.yaml up -d
      - name: Wait for Firestore
        run: |
          for attempt in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8686; then exit 0; fi
            sleep 2
          done
          docker compose -f compose.test.yaml logs
          exit 1
      - run: npm run test:firestore
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8686
      - if: always()
        run: docker compose -f compose.test.yaml down
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false && terraform -chdir=infra validate && terraform -chdir=infra fmt -check
